"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = 'catppuccin_mocha'

format = """\
$directory\
$git_branch\
$git_status\
$c\
$php\
$nodejs\
$python\
$rust\
$golang\
$java\
$kotlin\
$javascript\
$lua\
$cmd_duration\
$line_break\
$character"""

# ── Directory ─────────────────────────────────
[directory]
style = "bold lavender"
truncation_length = 3
truncate_to_repo = false
format = "[$path]($style) "

# ── Git Branch ────────────────────────────────
[git_branch]
format = "[on](overlay1) [$branch](bold peach) "

# ── Git Status ───────
[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold orange"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# ── Languages ───────
[c]
format = "[via](overlay1) [$symbol$version](bold green) "
symbol = "C "

[php]
format = "[via](overlay1) [$symbol$version](bold mauve) "
symbol = " "

[nodejs]
format = "[via](overlay1) [$symbol$version](bold green) "
symbol = " "

[python]
format = "[via](overlay1) [$symbol$version](bold yellow) "
symbol = " "

[java]
format = "[via](overlay1) [$symbol$version](bold red) "
symbol = " "

# ── Command Duration ──────
[cmd_duration]
min_time = 2_000
format = "[took](overlay1) [$duration](bold yellow) "

# ── Prompt Character ──────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"
